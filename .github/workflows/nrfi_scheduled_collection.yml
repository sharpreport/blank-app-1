name: SharpReport NRFI Scheduled Collection

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron uses UTC.
    # These windows cover the MLB day from morning through late night
    # in U.S. Eastern time. The Python collector itself only spends
    # Odds API credits when an uncaptured FINAL game is 5-60 minutes
    # from first pitch.
    - cron: "*/15 13-23 * * *"
    - cron: "*/15 0-6 * * *"

permissions:
  contents: read

concurrency:
  group: sharpreport-nrfi-scheduled-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out scanner repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scheduled NRFI collection
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_DATA_TOKEN: ${{ secrets.SHARPREPORT_DATA_TOKEN }}
          GITHUB_DATA_REPO: ${{ secrets.SHARPREPORT_DATA_REPO }}
          NRFI_CAPTURE_MIN_MINUTES: "5"
          NRFI_CAPTURE_MAX_MINUTES: "60"
        run: |
          python nrfi_scheduled_collector.py
